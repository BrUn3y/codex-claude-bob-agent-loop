[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triforge-agent-loop"
version = "0.1.0"
description = "TriForge: an auditable three-agent engineering council"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruney" }]
dependencies = []

[project.scripts]
agent-loop = "agent_loop.cli:main"

[tool.setuptools]
packages = ["agent_loop"]
